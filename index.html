f the four main periods of the year: spring, summer, autumn and winter", "hint": "four · periods · year · spring"}, {"en": "moon", "ko": "달", "definition": "the large round object that circles the Earth and that shines at night by reflecting light from the sun", "hint": "round · object · circles · Earth"}]];const $=id=>document.getElementById(id);const BANK_KEY='rainbows_wrong_words_v1';let wrongBank={};try{wrongBank=JSON.parse(localStorage.getItem(BANK_KEY)||'{}')||{}}catch(e){wrongBank={}};function bankKey(w){return norm(w.en)}function saveBank(){try{localStorage.setItem(BANK_KEY,JSON.stringify(wrongBank))}catch(e){}updateBankButton()}function bankWords(){return getPool().filter(w=>wrongBank[bankKey(w)])}function updateBankButton(){if(!$('savedReview'))return;let n=bankWords().length;$('savedReview').textContent='📒 선택한 Unit의 저장된 오답 복습 ('+n+'개)';$('savedReview').disabled=!n}let hintStage=0;let selected=new Set([0]),activePool=[],queue=[],idx=0,score=0,missed=[],locked=false,review=false;const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');function show(id){['home','game','result'].forEach(k=>$(k).classList.toggle('hidden',k!==id));$('homeBtn').classList.toggle('hidden',id==='home');if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function getPool(){return [...selected].sort((a,b)=>a-b).flatMap(i=>UNITS[i])}
function unitButtons(){
 $('units').innerHTML='';UNITS.forEach((u,i)=>{let b=document.createElement('button');let active=selected.has(i);b.className='unit'+(active?' active':'');b.textContent=(active?'✓ ':'')+'Unit '+(i+1);b.setAttribute('aria-pressed',String(active));b.onclick=()=>{if(selected.has(i))selected.delete(i);else selected.add(i);unitButtons();$('wordList').classList.add('hidden')};$('units').append(b)});

function chosenCount(){let n=getPool().length;let v=$('questionCount').value;return Math.min(n,Number(v))}
function updateCountInfo(){updateBankButton();let n=getPool().length;let count=chosenCount();$('countInfo').textContent=n?('선택한 '+n+'개 단어 중 '+count+'문제 출제'+(count<n?' · 매번 무작위 선택':' · 모든 단어 출제')):'Unit을 먼저 선택해 주세요.'}

function start(words,isReview=false){review=isReview;activePool=getPool();let mode=document.querySelector('input[name="mode"]:checked').value;queue=shuffle(words).slice(0,isReview?words.length:chosenCount()).map((w,i)=>({word:w,type:isReview?(Math.random()<0.5?'ko':'listen'):(mode==='mixed'?(i%2?'listen':'ko'):mode)}));idx=0;score=0;missed=[];show('game');render()}
function say(text){if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 읽기를 지원하지 않아요.');return}window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='en-US';utter.rate=Number($('speed').value)||.85;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(voice)utter.voice=voice;window.speechSynthesis.speak(utter)}
function speak(){say(queue[idx].word.definition)}
function speakWord(){say(queue[idx].word.en)}
function updateHint(){
 const w=queue[idx].word;

}
function nextHint(){hintStage=hintStage===2?0:hintStage+1;updateHint()}


function render(){locked=false;let q=queue[idx],w=q.word; $('progress').textContent=(idx+1)+' / '+queue.length+'문제';$('score').textContent='정답 '+score+'개';$('fill').style.width=(idx/queue.length*100)+'%';$('feedback').classList.add('hidden');$('answerAudio').classList.add('hidden');$('next').classList.add('hidden');$('choices').innerHTML='';$('listening').classList.toggle('hidden',q.type!=='listen');$('kind').textContent=q.type==='listen'?'🎧 영어 설명 듣고 영어 단어 찾기':'🇰🇷 한글 → 영어 단어 찾기';$('prompt').textContent=q.type==='listen'?'어떤 영어 단어일까요?':('“'+w.ko+'”를 영어로 하면?');hintStage=0;updateHint();let distract=shuffle(activePool.filter(x=>norm(x.en)!==norm(w.en))).slice(0,3);let options=shuffle([w,...distract]);options.forEach(item=>{let b=document.createElement('button');b.className='option';b.textContent=item.en;b.onclick=()=>finish(norm(item.en)===norm(w.en),b);$('choices').append(b)});if(q.type==='listen'){setTimeout(()=>{if(!locked&&queue[idx]===q)speak()},300)}}
function finish(correct,button){if(locked)return;locked=true;if('speechSynthesis' in window)window.speechSynthesis.cancel();let w=queue[idx].word;if(correct){score++;if(review&&wrongBank[bankKey(w)]){delete wrongBank[bankKey(w)];saveBank()}}else{missed.push(w);wrongBank[bankKey(w)]=true;saveBank()}$('score').textContent='정답 '+score+'개';$('feedback').textContent=(correct?'✅ 정답! ':'❌ 아쉬워! ')+w.en+' = '+w.ko+'\n영어 설명: '+w.definition;$('feedback').style.whiteSpace='pre-wrap';$('feedback').classList.remove('hidden');$('answerAudio').classList.remove('hidden');$('next').classList.remove('hidden');[...$('choices').children].forEach(b=>{b.disabled=true;if(norm(b.textContent)===norm(w.en))b.classList.add('correct')});if(!correct)button.classList.add('wrong')}
function end(){show('result');$('finalScore').textContent=score+' / '+queue.length;$('finalMsg').textContent='정답률 '+Math.round(score/queue.length*100)+'% · 틀린 단어 '+missed.length+'개';$('missed').innerHTML='';missed.forEach(w=>{let d=document.createElement('div');d.className='review';d.textContent=w.en+' — '+w.ko;$('missed').append(d)});if(!missed.length)$('missed').textContent='모두 정답! 정말 잘했어요 🌟';$('retry').classList.toggle('hidden',!missed.length)}
$('savedReview').onclick=()=>{let words=bankWords();if(words.length)start(words,true)};$('questionCount').onchange=updateCountInfo;$('start').onclick=()=>{if(selected.size)start(getPool())};$('selectAll').onclick=()=>{selected=new Set(UNITS.map((_,i)=>i));unitButtons()};$('clearAll').onclick=()=>{selected.clear();unitButtons()};$('next').onclick=()=>{idx++;if(idx>=queue.length)end();else render()};$('speak').onclick=speak;$('hintBtn').onclick=nextHint;$('wordAudio').onclick=speakWord;$('defAudio').onclick=speak;$('retry').onclick=()=>start(missed,true);$('restart').onclick=()=>{show('home');updateBankButton()};$('homeBtn').onclick=()=>{show('home');updateBankButton()};$('wordsBtn').onclick=()=>{let el=$('wordList');el.classList.toggle('hidden');if(!el.classList.contains('hidden')){el.innerHTML='<h3>선택한 Unit 단어 목록 ('+getPool().length+'개)</h3>';getPool().forEach(w=>{let d=document.createElement('div');d.className='review';d.textContent=w.en+' — '+w.ko+' ';let b=document.createElement('button');b.textContent='🔊 단어';b.style.padding='7px';b.onclick=()=>say(w.en);let c=document.createElement('button');c.textContent='🔊 설명';c.style.padding='7px';c.onclick=()=>say(w.definition);d.append(b,c);el.append(d)})}};unitButtons();updateBankButton();
